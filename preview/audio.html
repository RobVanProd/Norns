<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NORNS — Audio Preview</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; --bg: #11131a; --panel: #1b1f2a; --ink: #e6e2d6; --dim: #8d8a80; --gold: #e2b24a; --red: #d0605a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; color: var(--gold); letter-spacing: 0.04em; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 18px 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { background: var(--panel); color: var(--ink); border: 1px solid #2c3242; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--gold); }
    button.on { background: #3a2f12; border-color: var(--gold); color: var(--gold); }
    button.small { padding: 3px 7px; font-size: 12px; }
    #status { font: 12px/1.5 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; background: var(--panel); padding: 8px 10px; border-radius: 6px; margin-top: 8px; }
    #unlock { background: var(--gold); color: #1a1406; border: none; font-weight: 600; padding: 10px 16px; }
    label { color: var(--dim); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
    input[type=range] { width: 110px; }
    .sfx { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  </style>
</head>
<body>
  <h1>NORNS · Audio Preview</h1>
  <div class="row"><button id="unlock">Unlock audio</button><span id="hint" style="color:var(--dim)">Click to start the AudioContext (browsers require a gesture).</span></div>

  <h2>Music</h2>
  <div class="row" id="songs"></div>
  <div class="row" style="margin-top:8px">
    <button id="stop">Stop music</button>
    <span style="color:var(--dim)">Intensity:</span>
    <button class="int on" data-i="0">0</button><button class="int" data-i="1">1</button><button class="int" data-i="2">2</button>
    <button id="rewind">Rewind (hold)</button>
    <button id="pause">Pause</button>
    <span style="color:var(--dim)">Speed:</span>
    <button class="spd on" data-s="1">1×</button><button class="spd" data-s="2">2×</button><button class="spd" data-s="4">4×</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label>Master <input type="range" id="vMaster" min="0" max="1" step="0.01" value="0.9"></label>
    <label>Music <input type="range" id="vMusic" min="0" max="1" step="0.01" value="0.8"></label>
    <label>SFX <input type="range" id="vSfx" min="0" max="1" step="0.01" value="1"></label>
    <button id="mute">Mute</button>
  </div>

  <h2>Stingers</h2>
  <div class="row" id="stingers"></div>

  <h2>SFX <span style="text-transform:none;letter-spacing:0">(shift-click: random pan · alt-click: rising pitch series)</span></h2>
  <div class="sfx" id="sfx"></div>

  <div id="status">locked</div>
  <script type="module" src="./audio.ts"></script>
</body>
</html>
